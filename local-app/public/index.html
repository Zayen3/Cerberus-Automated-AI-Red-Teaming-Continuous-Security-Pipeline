<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vortex Labs // SUPPORT_AI</title>
    <meta name="description" content="VEX — the AI support assistant for Vortex Labs cyber-streetwear drops, shipping and returns." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0c10;
        --surface: rgba(255, 255, 255, 0.035);
        --stroke: rgba(255, 255, 255, 0.09);
        --text: #e9eaf2;
        --muted: #8b90a6;
        --lavender: #b39dff;
        --indigo: #6c4dff;
        --mint: #5ef2c0;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      /* ── gradient mesh ── */
      .mesh { position: fixed; inset: 0; pointer-events: none; filter: blur(90px); opacity: .55; }
      .mesh i { position: absolute; display: block; border-radius: 50%; }
      .m1 { width: 46vw; height: 46vw; left: -10vw; top: -12vw; background: var(--indigo); animation: float1 18s ease-in-out infinite; }
      .m2 { width: 38vw; height: 38vw; right: -8vw; top: 8vh; background: var(--lavender); animation: float2 22s ease-in-out infinite; }
      .m3 { width: 34vw; height: 34vw; left: 28vw; bottom: -18vw; background: var(--mint); opacity: .5; animation: float3 26s ease-in-out infinite; }
      @keyframes float1 { 50% { transform: translate3d(6vw, 4vh, 0) scale(1.12); } }
      @keyframes float2 { 50% { transform: translate3d(-5vw, 6vh, 0) scale(1.08); } }
      @keyframes float3 { 50% { transform: translate3d(4vw, -6vh, 0) scale(1.15); } }
      .grain { position: fixed; inset: 0; pointer-events: none; opacity: .05;
        background-image: radial-gradient(rgba(255,255,255,.6) 1px, transparent 1px);
        background-size: 3px 3px; }

      .shell { position: relative; z-index: 2; height: 100dvh; display: flex; flex-direction: column;
        max-width: 880px; margin: 0 auto; padding: 20px 18px 18px; }

      /* ── header ── */
      header {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 14px 18px; border: 1px solid var(--stroke); border-radius: 18px;
        background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .logo { width: 34px; height: 34px; border-radius: 11px; flex: none;
        background: conic-gradient(from 140deg, var(--indigo), var(--lavender), var(--mint), var(--indigo));
        box-shadow: 0 0 22px rgba(108,77,255,.55); animation: spin 9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .brand h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brand h1 span { color: var(--lavender); }
      .badge { display: inline-flex; align-items: center; gap: 8px; flex: none;
        font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .06em;
        padding: 7px 12px; border-radius: 999px; color: var(--mint);
        border: 1px solid rgba(94,242,192,.32); background: rgba(94,242,192,.07); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint);
        box-shadow: 0 0 0 0 rgba(94,242,192,.7); animation: pulse 1.8s infinite; }
      @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(94,242,192,0); } 100% { box-shadow: 0 0 0 0 rgba(94,242,192,0); } }

      /* ── messages ── */
      #log { flex: 1; overflow-y: auto; margin-top: 16px; padding: 6px 4px 4px;
        display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
      #log::-webkit-scrollbar { width: 6px; }
      #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }

      .row { display: flex; }
      .row.me { justify-content: flex-end; }
      .bubble { max-width: 78%; padding: 13px 16px; font-size: 14.5px; line-height: 1.62;
        border: 1px solid var(--stroke); border-radius: 18px; white-space: pre-wrap; word-wrap: break-word;
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        animation: rise .34s cubic-bezier(.2,.8,.25,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
      .bot { background: var(--surface); border-top-left-radius: 6px; }
      .me .bubble { border-top-right-radius: 6px; color: #fff;
        background: linear-gradient(135deg, rgba(108,77,255,.9), rgba(179,157,255,.8));
        border-color: rgba(179,157,255,.4); box-shadow: 0 8px 32px rgba(108,77,255,.28); }
      .who { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

      .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
      .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--lavender); animation: bounce 1.1s infinite; }
      .typing i:nth-child(2) { animation-delay: .16s; }
      .typing i:nth-child(3) { animation-delay: .32s; }
      @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-6px); opacity: 1; } }

      /* ── chips ── */
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 2px 10px; }
      .chip { font-size: 12.5px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
        color: var(--muted); background: var(--surface); border: 1px solid var(--stroke);
        backdrop-filter: blur(16px); transition: .22s ease; }
      .chip:hover { color: #fff; border-color: rgba(179,157,255,.5); transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(108,77,255,.25); }

      /* ── composer ── */
      form { display: flex; gap: 10px; align-items: center; padding: 8px;
        border: 1px solid var(--stroke); border-radius: 20px; background: var(--surface);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: .25s ease; }
      form:focus-within { border-color: rgba(179,157,255,.55); box-shadow: 0 0 0 4px rgba(108,77,255,.13), 0 10px 40px rgba(108,77,255,.2); }
      input { flex: 1; background: transparent; border: 0; outline: none; color: var(--text);
        font: inherit; font-size: 14.5px; padding: 12px 14px; }
      input::placeholder { color: #61667c; }
      button.send { flex: none; border: 0; cursor: pointer; color: #0b0c10; font: inherit; font-weight: 600;
        font-size: 13.5px; padding: 12px 20px; border-radius: 14px;
        background: linear-gradient(135deg, var(--mint), var(--lavender)); transition: .22s ease; }
      button.send:hover { filter: brightness(1.08); box-shadow: 0 8px 26px rgba(94,242,192,.3); }
      button.send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
      footer { text-align: center; font-family: "JetBrains Mono", monospace; font-size: 10px;
        letter-spacing: .12em; color: #4d5266; margin-top: 10px; text-transform: uppercase; }
      @media (max-width: 560px) {
        .badge span.txt { display: none; }
        .bubble { max-width: 88%; }
      }
    </style>
  </head>
  <body>
    <div class="mesh"><i class="m1"></i><i class="m2"></i><i class="m3"></i></div>
    <div class="grain"></div>

    <div class="shell">
      <header>
        <div class="brand">
          <div class="logo"></div>
          <h1>Vortex Labs <span>// Support_AI</span></h1>
        </div>
        <div class="badge"><span class="dot"></span><span class="txt">ONLINE | Llama-3.2 (Local)</span></div>
      </header>

      <div id="log"></div>

      <div class="chips">
        <button class="chip" type="button">Drop Schedule</button>
        <button class="chip" type="button">Order Tracking</button>
        <button class="chip" type="button">Return Policy</button>
        <button class="chip" type="button">Shipping Times</button>
        <button class="chip" type="button">Size Guide</button>
      </div>

      <form id="form" autocomplete="off">
        <input id="input" placeholder="Ask VEX anything about the drop…" />
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <footer>Vortex Labs © 2026 — Local build</footer>
    </div>

    <script>
      const API = "http://localhost:3000/api/chat";
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");

      const scroll = () => (log.scrollTop = log.scrollHeight);

      function bubble(role, text) {
        const row = document.createElement("div");
        row.className = "row " + (role === "user" ? "me" : "bot-row");
        const b = document.createElement("div");
        b.className = "bubble " + (role === "user" ? "" : "bot");
        if (role !== "user") {
          const who = document.createElement("p");
          who.className = "who";
          who.textContent = "VEX";
          b.appendChild(who);
        }
        b.appendChild(document.createTextNode(text));
        row.appendChild(b);
        log.appendChild(row);
        scroll();
        return row;
      }

      function typing() {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML =
          '<div class="bubble bot"><p class="who">VEX</p><span class="typing"><i></i><i></i><i></i></span></div>';
        log.appendChild(row);
        scroll();
        return row;
      }

      bubble(
        "bot",
        "yo — welcome to Vortex Labs ⚡ I'm VEX, your support AI. Drops, shipping, returns, sizing — ask away."
      );

      document.querySelectorAll(".chip").forEach((c) =>
        c.addEventListener("click", () => {
          input.value = c.textContent.trim();
          form.requestSubmit();
        })
      );

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        send.disabled = true;
        bubble("user", message);
        const t = typing();
        try {
          const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await res.json();
          t.remove();
          bubble("bot", data.response || data.error || "No response received.");
        } catch (err) {
          t.remove();
          bubble("bot", "⚠️ Can't reach the server. Make sure `node server.js` and Ollama are running.");
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
